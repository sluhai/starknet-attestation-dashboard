            - refId: A
              relativeTimeRange:
                from: 60
                to: 0
              datasourceUid: beo6ke2svn08wb
              model:
                editorMode: code
                expr: |-
                    100 * (
                      increase(validator_attestation_attestation_confirmed_count{exported_network="SN_SEPOLIA"}[24h])
                      /
                      (
                        increase(validator_attestation_attestation_confirmed_count{exported_network="SN_SEPOLIA"}[24h])
                        +
                        increase(validator_attestation_missed_epochs_count{exported_network="SN_SEPOLIA"}[24h])
                      )
                    )
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 99.5
                        type: lte
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Alerting
          for: 30s
          annotations:
            summary: Attestation success rate dropped below 99.5% over the last 24h on SEPOLIA (two or more missed epochs). Check logs or metrics.
